<svg id="neohumanMasterSvg" class="w-full max-w-4xl h-auto ambient-flow select-none" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg"><style>
                @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&amp;family=Inter:wght@500&amp;display=swap');
                .font-display { font-family: 'Space Grotesk', sans-serif; font-size: 76px; font-weight: 500; fill: #0F172A; }
                .font-sans { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; text-transform: uppercase; fill: #0891B2; }
                .hidden { display: none; }
                .taper-ribbon { clip-path: inset(0 100% 0 0); opacity: 0; animation: spawnRibbon 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: var(--delay, 0s); }
                .face-sculpt { clip-path: inset(0 100% 0 0); opacity: 0; animation: spawnRibbon 1.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: var(--delay, 0.55s); }
                .face-contour { stroke-dasharray: 380; stroke-dashoffset: 380; opacity: 0; animation: spawnFace 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: var(--delay, 0.5s); }
                .word-char { opacity: 0; animation: spawnChar 0.8s ease forwards; animation-delay: var(--delay, 0.65s); }
                .neo-bar { opacity: 0; animation: spawnChar 0.65s ease forwards; animation-delay: var(--delay, 0.7s); }
                .tagline-reveal { opacity: 0; letter-spacing: 0.32em; animation: spawnChar 1.1s ease forwards 1.25s; }
                @keyframes spawnRibbon { 25% { opacity: 1; } to { clip-path: inset(0 0% 0 0); opacity: 1; } }
                @keyframes spawnFace { 25% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
                @keyframes spawnChar { to { opacity: 1; } }
            </style>
                    <defs>
                        <!-- Unified Option 05 Reference Gradient (Cerulean Left Tips -> Royal Cobalt Center -> Deep Indigo-Violet Right) -->
                        <linearGradient id="waveGrad" x1="12" y1="152" x2="236" y2="128" gradientUnits="userSpaceOnUse">
                            <stop id="gradStop1" offset="0%" stop-color="#1982C4"/>
                            <stop id="gradStop2" offset="42%" stop-color="#3F56B5"/>
                            <stop id="gradStop3" offset="100%" stop-color="#6A389F"/>
                        </linearGradient>
                    </defs>

                    <!-- ========================================================= -->
                    <!-- ICON: WAVE AVATAR (True Calligraphic Tapered Vector)      -->
                    <!-- ========================================================= -->
                    <g id="waveAvatarIcon" transform="translate(18, 4)">

                        <!-- 1. UPPER CRANIUM CALLIGRAPHIC RIBBONS (Razor-sharp left tips -> smooth right dome) -->
                        <g fill="url(#waveGrad)">
                            <!-- Crown Ribbon 1 (Topmost arch, feathers from x=84 to right temple x=233) -->
                            <path class="taper-ribbon" style="--delay: 0.02s" d="M 84 42 C 122 25, 174 28, 206 54 C 224 69, 233 90, 234 114 C 232 92, 220 73, 201 59 C 170 35, 122 31, 84 42 Z"/>

                            <!-- Crown Ribbon 2 (Feathers from x=66) -->
                            <path class="taper-ribbon" style="--delay: 0.06s" d="M 66 56 C 108 34, 164 38, 202 64 C 220 77, 231 95, 234 115 C 229 98, 216 82, 196 69 C 160 45, 106 40, 66 56 Z"/>

                            <!-- Crown Ribbon 3 (Feathers from x=54) -->
                            <path class="taper-ribbon" style="--delay: 0.10s" d="M 54 71 C 98 45, 154 50, 196 75 C 214 86, 227 100, 234 116 C 226 103, 211 91, 190 80 C 150 58, 96 51, 54 71 Z"/>

                            <!-- Forehead S-Wave Ribbon 4 (Feathers from x=45, sweeps across forehead to temple) -->
                            <path class="taper-ribbon" style="--delay: 0.14s" d="M 45 87 C 88 58, 138 62, 176 84 C 198 96, 218 102, 233 117 C 216 106, 194 101, 170 89 C 134 70, 86 64, 45 87 Z"/>

                            <!-- Mid-Forehead S-Wave Ribbon 5 (Feathers from x=36, dips gracefully near glabella) -->
                            <path class="taper-ribbon" style="--delay: 0.18s" d="M 36 104 C 78 72, 126 72, 156 97 C 172 110, 194 108, 228 118 C 194 112, 168 113, 150 101 C 122 80, 76 78, 36 104 Z"/>

                            <!-- Lower-Forehead Wave 6 (Feathers from x=26, flows into fine inner brow crease) -->
